version: '3'
services:
  proxy_nginx:
    container_name: "proxy_nginx"
    build: ./docker/nginx/
    ports:
      - "8081:80"
      - "8044:8044"
    volumes:
      - .:/var/www/project/current
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - proxy_php
  proxy_php:
    container_name: "proxy_php"
    build: ./docker/php/
    volumes:
      - .:/var/www/project/current/
      - ./docker/php/conf.d/php.ini:/usr/local/etc/php/conf.d/php.ini
    extra_hosts:
      host.docker.internal: host-gateway
  chromedriver:
    container_name: "proxy_chromedriver"
    build: ./docker/chromedriver/
    init: true
    environment:
      - CHROMIUM_VERSION=726767
    ports:
      - 4444:4444
    shm_size: 1g
    extra_hosts:
      host.docker.internal: host-gateway

